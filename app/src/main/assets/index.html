
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آلة حاسبة</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.calculator{width:100%;max-width:380px;padding:20px}
.display{width:100%;height:100px;background:#222;border:0;border-radius:15px;color:white;font-size:40px;text-align:right;padding:15px;margin-bottom:15px}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:75px;border:0;border-radius:15px;font-size:28px;background:#333;color:white}
button:active{transform:scale(.95)}
.operator{background:#555}
.equal{background:#777;grid-column:1/5}
.clear,.delete{background:#444}
</style>
</head>
<body>
<div class="calculator">
<input class="display" id="display" value="" readonly>
<div class="buttons">

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="operator" onclick="add('/')">÷</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="operator" onclick="add('*')">X</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="operator" onclick="add('-')">-</button>

<button onclick="add('0')">0</button>
<button class="clear" onclick="clearDisplay()">C</button>
<button class="delete" onclick="deleteLast()">⌫</button>
<button class="operator" onclick="add('+')">+</button>

<button class="equal" onclick="calculate()">=</button>

</div>
</div>

<script>
const display=document.getElementById("display");

function add(value){
display.value+=value;
}

function clearDisplay(){
display.value="";
}

function deleteLast(){
display.value=display.value.slice(0,-1);
}

function calculate(){
try{
display.value=eval(display.value);
}catch{
display.value="Error";
}
}
</script>
</body>
</html>
